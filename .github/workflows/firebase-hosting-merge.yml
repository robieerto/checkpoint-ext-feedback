# Requires FIREBASE_SERVICE_ACCOUNT_OFRULES_GUESTS secret — owner of ofrules-guests project
# must run: firebase init hosting:github --project ofrules-guests
name: Deploy to Production on merge

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OFRULES_GUESTS }}
          channelId: live
          projectId: ofrules-guests
          target: production
